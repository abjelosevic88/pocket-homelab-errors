# Pocket Errors (Go + SQLite) — error tracking for your apps and websites; Sentry SDKs send here. One container, one volume.
services:
  pocket-errors:
    image: ghcr.io/abjelosevic88/pocket-homelab-errors:latest
    container_name: pocket-errors
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # NOTIFY_URL: https://ntfy.sh/my-errors
      # Pocket Core: one sign-in, Pocket AI, Pocket Alerts / Projects / Tasks, errors from other Pocket apps.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
      # Read this box's containers' logs for errors (Settings → This box). Optional.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      # Logs: the services' and the kernel's lines from the journal, too. Optional.
      # - /var/log/journal:/host/journal:ro
    # the socket belongs to the docker group, the journal to systemd-journal: their ids on your host
    # (getent group docker systemd-journal)
    # group_add: ["999", "998"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
